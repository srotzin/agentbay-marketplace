<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0F172A"/>
      <stop offset="100%" style="stop-color:#1E293B"/>
    </linearGradient>
    <linearGradient id="hex" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2563EB"/>
      <stop offset="100%" style="stop-color:#3B82F6"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" rx="64" fill="url(#bg)"/>
  <!-- Hexagon shape -->
  <polygon points="256,80 392,168 392,344 256,432 120,344 120,168" fill="none" stroke="url(#hex)" stroke-width="12" filter="url(#glow)"/>
  <!-- Inner hexagon -->
  <polygon points="256,140 352,196 352,308 256,364 160,308 160,196" fill="url(#hex)" opacity="0.15"/>
  <!-- H letter -->
  <text x="256" y="290" font-family="Inter,system-ui,sans-serif" font-size="160" font-weight="800" fill="white" text-anchor="middle" dominant-baseline="central">H</text>
  <!-- Connection dots -->
  <circle cx="256" cy="80" r="8" fill="#3B82F6"/>
  <circle cx="392" cy="168" r="8" fill="#3B82F6"/>
  <circle cx="392" cy="344" r="8" fill="#3B82F6"/>
  <circle cx="256" cy="432" r="8" fill="#3B82F6"/>
  <circle cx="120" cy="344" r="8" fill="#3B82F6"/>
  <circle cx="120" cy="168" r="8" fill="#3B82F6"/>
</svg>
