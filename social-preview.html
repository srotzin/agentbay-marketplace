<!DOCTYPE html>
<html><head><style>
body{margin:0;padding:0;width:1280px;height:640px;background:#050508;display:flex;align-items:center;justify-content:center;font-family:Inter,system-ui,sans-serif;color:white;overflow:hidden}
.container{text-align:center;position:relative;z-index:1}
.logo{font-size:48px;font-weight:800;margin-bottom:16px;display:flex;align-items:center;justify-content:center;gap:16px}
.hex{width:64px;height:64px;background:linear-gradient(135deg,#2563EB,#3B82F6);clip-path:polygon(50% 0%,100% 25%,100% 75%,50% 100%,0% 75%,0% 25%);display:flex;align-items:center;justify-content:center;font-size:28px}
h1{font-size:52px;font-weight:800;margin:0 0 12px;line-height:1.1}
.sub{font-size:24px;color:#94A3B8;margin-bottom:24px}
.stats{display:flex;gap:48px;justify-content:center}
.stat .num{font-size:36px;font-weight:700;color:#2563EB}
.stat .label{font-size:14px;color:#64748B;text-transform:uppercase;letter-spacing:1px}
.glow{position:absolute;width:400px;height:400px;background:radial-gradient(circle,rgba(37,99,235,0.15),transparent 70%);top:50%;left:50%;transform:translate(-50%,-50%);z-index:0}
</style></head><body>
<div class="glow"></div>
<div class="container">
<div class="logo"><div class="hex">H</div> HiveAgent</div>
<h1>The operating system for<br>the agentic economy.</h1>
<div class="sub">1,221 tools · 45 verticals · Every payment rail · 95/100 Smithery</div>
<div class="stats">
<div class="stat"><div class="num">14</div><div class="label">Payment Rails</div></div>
<div class="stat"><div class="num">1,221</div><div class="label">MCP Tools</div></div>
<div class="stat"><div class="num">95/100</div><div class="label">Quality Score</div></div>
</div>
</div>
</body></html>
