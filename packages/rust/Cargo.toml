[package]
name = "hiveagent"
version = "0.1.0"
edition = "2021"
description = "HiveAgent MCP client — 828 tools across 40 verticals"
repository = "https://github.com/hiveagentiq/hiveagent-rust"
homepage = "https://hiveagentiq.com"
documentation = "https://docs.rs/hiveagent"
license = "MIT"
keywords = ["mcp", "ai-agent", "hiveagent", "defi", "llm"]
categories = ["api-bindings", "web-programming::http-client", "asynchronous"]
readme = "README.md"

[dependencies]
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
thiserror = "1"

[dev-dependencies]
tokio = { version = "1", features = ["full", "macros"] }
